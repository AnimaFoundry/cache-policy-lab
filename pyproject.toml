[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-policy-lab"
version = "0.1.0"
description = "Auditable offline comparisons of cache policies on synthetic or sanitized traces"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.scripts]
cache-policy-lab = "cache_policy_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cache_policy_lab = ["examples/*.jsonl"]
